<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YAML Config Editor</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1e1e1e;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #controls {
      padding: 10px;
      background-color: #1e1e1e;
      display: flex;
      justify-content: flex-end;
      border-bottom: 1px solid #444;
    }

    #editor {
      flex: 1;
      min-height: 0;
    }

    button {
      padding: 10px 20px;
      margin-left: 10px;
      background-color: #007acc;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>

  <div id="controls">
    <button onclick="saveConfig()">Save Config</button>
  </div>
  <div id="editor">Loading YAML config...</div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs/loader.js"></script>

  <script>
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs' } });

    require(['vs/editor/editor.main'], function () {
      window.editor = monaco.editor.create(document.getElementById('editor'), {
        value: 'Loading...',
        language: 'yaml',
        theme: 'vs-dark',
        automaticLayout: true
      });

      axios.get('/config')
        .then(res => {
          const yamlText = jsyaml.dump(res.data);
          editor.setValue(yamlText);
        })
        .catch(err => {
          console.error('Error loading config:', err);
          editor.setValue('# Failed to load config\n' + err.toString());
        });
    });

    async function saveConfig() {
      try {
        const yamlText = window.editor.getValue();
        const jsonData = jsyaml.load(yamlText);
        await axios.post('/config', jsonData);
        alert('Config saved successfully!');
      } catch (err) {
        alert('Failed to save config: ' + err.message);
        console.error('Save error:', err);
      }
    }
  </script>
</body>
</html>
