<body>

  <form id="myForm">
    <label for="radioGroup">Choose an option:</label>
    <input type="radio" id="option1" name="radioGroup" value="option1">Option 1
    <input type="radio" id="option2" name="radioGroup" value="option2">Option 2
    <input type="radio" id="option3" name="radioGroup" value="option3">Option 3

    <label for="numberField1">Number Field 1:</label>
    <input type="number" id="numberField1" name="numberField1">

    <label for="numberField2">Number Field 2:</label>
    <input type="number" id="numberField2" name="numberField2">

    <button type="button" onclick="submitForm()">Submit</button>
  </form>

  <script>
    function submitForm() {
      var form = document.getElementById("myForm");
      var formData = new FormData(form);
      var queryString = new URLSearchParams(formData).toString();

      // Replace 'your-api-endpoint' with the actual API endpoint
      var apiEndpoint = 'https://example.com/api/endpoint?' + queryString;

      // You can use fetch or any other method to call the API
      fetch(apiEndpoint, {
        method: 'GET', // Adjust the method as needed (GET, POST, etc.)
        // Add headers if required
      })
      .then(response => response.json())
      .then(data => {
        // Handle the API response here
        console.log(data);
      })
      .catch(error => {
        // Handle errors here
        console.error('Error:', error);
      });
    }
  </script>

</body>
