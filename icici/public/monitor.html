<!DOCTYPE html>
<html>

<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <style>
    
  table {
    border-collapse: collapse;
    margin: 10px 0;
    border: 1px solid #ccc;
    
  }
  th, td {
    padding: 8px 12px;
    border: 1px solid #aaa;
    text-align: left;
  }
  th.key-column, td.key-column {
    width: 200px; /* adjust as needed */
  }
  th.value-column, td.value-column {
    width: 200px;
  }
</style>
</head>

<body>

    <h1>Current Status</h1>
    <div id="result"></div>

    <script>

    function renderJSONAsHTML(data) {
        let container = $("#result");
        let jsonData = JSON.parse(data)
        let html = '<ul>';
        for (let key in jsonData) {
            if (jsonData.hasOwnProperty(key)) {
            html += `<li><strong>${key}</strong>: ${jsonData[key]}</li>`;
            }
        }
        html += '</ul>';

        container.html(html)
        return html;
    }
    
    function convertToNestedTable(obj) {

        const table = document.createElement("table");
        for (const key in obj) {
        const row = table.insertRow();
        const cellKey = row.insertCell();
        cellKey.className = "key-column";
        const cellValue = row.insertCell();
        cellKey.className = "value-column";
        cellKey.textContent = key;

        if (typeof obj[key] === "object" && obj[key] !== null) {
            if (Array.isArray(obj[key])) {
            const list = document.createElement("ul");
            obj[key].forEach(item => {
                const listItem = document.createElement("li");
                if (typeof item === "object") {
                listItem.appendChild(convertToNestedTable(item));
                } else {
                listItem.textContent = item;
                }
                list.appendChild(listItem);
            });
            cellValue.appendChild(list);
            } else {
            cellValue.appendChild(convertToNestedTable(obj[key]));
            }
        } else {
            cellValue.textContent = obj[key];
        }
        }
        return table;
    }        

    function convert(data) {
            let jsonData = JSON.parse(data)
            console.log(jsonData)
            // console.log('jsonData: ', jsonData)

            //  // Sample JSON data
            //  let jsonData = [
            //     {
            //        name: "Saurabh",
            //        age: "20",
            //        city: "Prayagraj"
            //     },
            //     {
            //        name: "Vipin",
            //        age: 23,
            //        city: "Lucknow",
            //     },
            //     {
            //        name: "Saksham",
            //        age: 21,
            //        city: "Noida"
            //     }
            //  ];

            // Get the container element where the table will be inserted
            let container = $("#result");

            // Create the table element
            let table = $("<table>");

            // Get the keys (column names) of the first object in the JSON data
            let cols = Object.keys(jsonData);

            // Create the header element
            let thead = $("<thead style=''border 1px solid red>");
            let tr = $("<tr>");

            // Loop through the column names and create header cells
            $.each(cols, function (i, item) {
                let th = $("<th>");
                th.text(item); // Set the column name as the text of the header cell
                tr.append(th); // Append the header cell to the header row
            });
            thead.append(tr); // Append the header row to the header
            table.append(tr) // Append the header to the table

            tr = $("<tr class='row'>");
            // Loop through the JSON data and create table rows
            $.each(jsonData, function (i, item) {
                

                // Get the values of the current object in the JSON data
                let vals = Object.values(item);

                console.log('i: ', i, ' item: ', item, vals)

                let td = $("<td>");
                td.text(item)
                tr.append(td)
            });
            table.append(tr); 
            container.html(table) // Append the table to the container element
        }

        if (typeof (EventSource) !== "undefined") {
            var source = new EventSource("http://localhost:3000/statusstream");
            source.onmessage = function (event) {
                // renderJSONAsHTML(event.data)
                let container = $("#result");
                // convert(event.data)
                console.log(event.data)
                let jsonData = JSON.parse(event.data)

                container.html(convertToNestedTable(jsonData))
            };
        } else {
            document.getElementById("result").innerHTML = "Sorry, your browser does not support server-sent events...";
        }
    </script>

</body>

</html>
