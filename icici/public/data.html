<!DOCTYPE html>
<html>

<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <style>
    
table, th, td {
    border: 1px solid black;
  } 

  td {
      width: 100px;
      text-align: center;
  }
</style>   
</head>

<body>

    <h1>Current Status</h1>
    <div id="result"></div>

    <script>

        function convert(data) {
            let jsonData = JSON.parse(data)
            console.log('jsonData: ', jsonData)

             // Sample JSON data
            // {startPrice: "22005.95", currentPrice: "22013.50", plusCount: 26, minusCount: 24, change: 7.5}

            // Get the container element where the table will be inserted
            let container = $("#result");

            // Create the table element
            let table = $("<table>");

            // Get the keys (column names) of the first object in the JSON data
            let cols = Object.keys(jsonData);

            // Create the header element
            let thead = $("<thead style=''border 1px solid red>");
            let tr = $("<tr>");

            // Loop through the column names and create header cells
            $.each(cols, function (i, item) {
                let th = $("<th>");
                th.text(item); // Set the column name as the text of the header cell
                tr.append(th); // Append the header cell to the header row
            });
            thead.append(tr); // Append the header row to the header
            table.append(tr) // Append the header to the table

            // Loop through the JSON data and create table rows
                let tr1 = $("<tr class='row'>");

                // Get the values of the current object in the JSON data
                let vals = Object.values(jsonData);

                // Loop through the values and create table cells
                $.each(vals, (i, elem) => {
                    let td = $("<td>");
                    td.text(elem); // Set the value as the text of the table cell
                    tr1.append(td); // Append the table cell to the table row
                });
                table.append(tr1); // Append the table row to the table
            container.html(table) // Append the table to the container element
        }

        if (typeof (EventSource) !== "undefined") {
            var source = new EventSource("http://localhost:3000/datastream");
            source.onmessage = function (event) {
                convert(event.data)
            };
        } else {
            document.getElementById("result").innerHTML = "Sorry, your browser does not support server-sent events...";
        }
    </script>

</body>

</html>
