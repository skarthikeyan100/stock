<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <title>PropFirm Trading Platform</title>
    <!-- Set the theme before first paint (no flash). Must match ThemeContext.tsx: an explicit choice
         (localStorage 'theme', written only by the toggle), else the page default: dark on '/' and the
         public legal pages, light everywhere else. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          var p = location.pathname.replace(/\/+$/, '') || '/';
          t = (p === '/' || p === '/privacy-policy' || p === '/terms-and-conditions') ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
