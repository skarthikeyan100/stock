settings:
  minPrice: 20
  maxPrice: 30000
  targetPriceDiff: 2
  stopLossPriceDiff: 11
  trailingDistance: 4
  cooldownSeconds: 0
  logQuotes: false
  maxDailyDrawdownPercent: 25%
  maxWeeklyDrawdownPercent: 50%
  targetPoints: 2
  stopLossPoints: 11
  target: 10              # global exit: points above entry, or "N%", or none (strategies override with their own target)
  stopLoss: 20            # global exit: points below entry, or "N%", or none
  maxHoldTimeMinutes: 60  # global timeout: minutes a position is held (winners and losers alike); 'none' = no timeout
  skipNearestExpiryOnEve: false
  skipNearestExpiryOnExpiryDay: true
  hotRestartDuringMarketHours: false
  eodCloseTime: '15:50'
  mirrorPercentage: 100%  # admin mirrors this % of every frontend user's lots (floor to whole lots) with its own real order; 0 = no mirror
