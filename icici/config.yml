    gapReversalMode: false
    gapReversalThreshold: 100
    logEnabled: true
  # One RuleBased block = one strategy. Each line under indicators is a RULE; commas join indicators that must agree within that rule.
  # A rule that fires buys; rules that disagree on the same candle (one CE, one PE) give no trade. One position at a time.
  # Six rules: 3 pairs and 3 single indicators, chosen from the 20-rule block by backtest (backtest-results/rulebased-final, 5-minute).
  # The other rules fired on the same candles and added no trades (npm run analyze:ruleBlockLevers). See analysis_next.md.
  # DISABLED: 4 days, all rising; the backtest does not show them beating always-CALL on net P&L. Enable deliberately only.
  - type: RuleBasedStrategy
    enabled: true
    # Two single-indicator rules (2026-11-11). The earlier six-rule set is kept in strategies.md ("RuleBasedStrategy: previous rule set").
    indicators:
      - Bollinger_5_1
      - MACD_4_8_3
    quantity: 65
    # One exit set for the whole block: 10-point target, no stop, 60-minute timeout (backtest-results/ruleblock-final, grid).
    target: 10
    stopLoss: none
    maxHoldTimeMinutes: 60
    logEnabled: true
